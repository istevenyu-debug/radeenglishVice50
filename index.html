y", "satisfactory", "accepted"], "answer": 2, "sourcePage": 2, "zh": "希望您會覺得這些條件令您滿意。", "fillTemplate": "We hope that you will find these {0} {1}.", "fillAnswers": ["terms", "satisfactory"]}, {"id": 46, "unit": "b", "sentence": "We look forward to ____.", "options": ["hear from you soon", "hearing of you soon", "you promptly reply", "your prompt reply"], "answer": 3, "sourcePage": 2, "zh": "期待您即刻回覆。", "fillTemplate": "We look forward to your {0}.", "fillAnswers": ["prompt reply"]}, {"id": 47, "unit": "b", "sentence": "We ____ for 20 years.", "options": ["are in this line of business", "do business with European importers in washing machines", "have been exporting printers", "have established here as general exporters"], "answer": 2, "sourcePage": 2, "zh": "我們出口印表機已二十年了。", "fillTemplate": "We have been {0} {1} for 20 years.", "fillAnswers": ["exporting", "printers"]}, {"id": 48, "unit": "b", "sentence": "We are importers in the textile trade and would like to get in touch with ____ of this line.", "options": ["buyers", "suppliers", "customers", "consigners"], "answer": 1, "sourcePage": 2, "zh": "我們是紡織品的進口商，想與同行供應商接洽。", "fillTemplate": "We are importers in the {0} trade and would like to get in {1} with suppliers of this line.", "fillAnswers": ["textile", "touch"]}, {"id": 49, "unit": "b", "sentence": "We have quoted our most ____ prices.", "options": ["favor", "favoring", "favorite", "favorable"], "answer": 3, "sourcePage": 2, "zh": "我們已經報上我們最優惠的價格。", "fillTemplate": "We have {0} our most {1} prices.", "fillAnswers": ["quoted", "favorable"]}, {"id": 50, "unit": "b", "sentence": "We apologize for the delay and trust it will not ____.", "options": ["cause your inconvenience", "cause your problem", "cause you problem", "cause you inconvenience"], "answer": 3, "sourcePage": 2, "zh": "對於我們的延遲所造成的不便深感抱歉。", "fillTemplate": "We {0} for the {1} and trust it will not {2} you {3}.", "fillAnswers": ["apologize", "delay", "cause", "inconvenience"]}]</script><script>const Q=JSON.parse(document.getElementById('data').textContent),$=s=>document.querySelector(s),SK='te50stats5v1',HK='te50hist5v1';let C={type:'fill',g:1,range:'front'},S=null;
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),N=s=>String(s||'').toLowerCase().trim().replace(/\s+/g,' '),F=n=>(Math.round(n*10)/10).toFixed(1).replace('.0','');
function b(g){let a=(g-1)*5+1;return[a,a+4]}function ids(g){let[a,z]=b(g);return Q.filter(q=>q.id>=a&&q.id<=z).map(q=>q.id)}function slots(g){return ids(g).reduce((n,id)=>n+Q.find(q=>q.id==id).fillAnswers.length,0)}
function stats(){let x={};try{x=JSON.parse(localStorage.getItem(SK)||'{}')}catch{};for(let i=1;i<=10;i++)if(!x[i])x[i]={n:0,sum:0};return x}function st(g){let x=stats()[g];return`已練 ${x.n} 次｜平均 ${F(x.n?x.sum/x.n:0)} 分`}
function hist(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch{return[]}}let _voices=[];

function say(t){

document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{C.type=x.dataset.t;home()});document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{C.g=+x.dataset.g;home()});document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{C.range=x.dataset.r;start()});$('#go').onclick=()=>start();$('#history').onclick=showHist}
function start(retryIds=null){let a;if(retryIds)a=retryIds;else if(C.type=='fill')a=ids(C.g);else a=C.range=='front'?Q.filter(q=>q.id<=25).map(q=>q.id):C.range=='back'?Q.filter(q=>q.id>25).map(q=>q.id):Q.map(q=>q.id);S={ids:a,i:0,res:[],retry:!!retryIds,correctSlots:0,totalSlots:C.type=='fill'&&!retryIds?slots(C.g):0};question()}
function question(){let q=Q.find(x=>x.id==S.ids[S.i]);$('#app').innerHTML=`<div class="top"><b>${C.type=='fill'?`填充題 第${C.g}組`:'選擇題'} · ${S.i+1}/${S.ids.length}</b><button class="btn" id="home">回首頁</button></div><div class="card"><div class="small">原題 ${q.id}</div>${C.type=='fill'?fill(q):choice(q)}<div id="fb"></div><div id="next"></div></div>`;$('#home').onclick=home;C.type=='fill'?bindFill(q):bindChoice(q)}
function fill(q){let s=q.fillTemplate.replace(/\{(\d+)\}/g,(_,n)=>`<input class="blank" data-i="${n}" autocomplete="off" autocapitalize="none" spellcheck="false">`);return`<p class="zh">${E(q.zh)}</p><div class="q">${s}</div><button class="btn primary" id="check">檢查答案</button>`}
function bindFill(q){$('#check').onclick=()=>{let ins=[...document.querySelectorAll('.blank')],vals=ins.map(x=>x.value);if(vals.every(v=>!v.trim()))return;let c=0,w=[];ins.forEach((x,i)=>{let ok=N(x.value)==N(q.fillAnswers[i]);x.classList.add(ok?'ok':'bad');x.disabled=true;if(ok)c++;else w.push(q.fillAnswers[i])});S.correctSlots+=c;S.res.push({id:q.id,ok:c==q.fillAnswers.length,c,t:q.fillAnswers.length,ans:q.fillAnswers.join(' / '),zh:q.zh,a:w});$('#check').disabled=true;$('#fb').innerHTML=`<div class="feedback">本題答對 ${c}/${q.fillAnswers.length} 格<br>正確答案：<b>${q.fillAnswers.map(E).join(' ／ ')}</b></div><div class="trans"><b>中文：</b>${E(q.zh)}</div>${w.length?`<div class="trans"><b>錯誤格發音：</b><br>${aud(w)}</div>`:''}`;ba();nxt()}}
function choice(q){return`<div class="q">${E(q.sentence).replace('____','＿＿＿＿')}</div>${q.options.map((o,i)=>`<button class="opt" data-o="${i}">${String.fromCharCode(65+i)}. ${E(o)}</button>`).join('')}`}
function bindChoice(q){document.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{let p=+x.dataset.o,ok=p==q.answer;document.querySelectorAll('[data-o]').forEach((y,i)=>{y.disabled=true;if(i==q.answer)y.classList.add('ok');if(i==p&&!ok)y.classList.add('bad')});S.res.push({id:q.id,ok,ans:q.options[q.answer],zh:q.zh,a:ok?[]:[q.options[q.answer]]});$('#fb').innerHTML=`<div class="feedback">${ok?'✓ 答對':'✕ 答錯'}；答案：<b>${E(q.options[q.answer])}</b></div><div class="trans"><b>中文：</b>${E(q.zh)}</div>${ok?'':`<div class="trans"><b>答案發音：</b><br>${aud([q.options[q.answer]])}</div>`}`;ba();nxt()})}
function nxt(){let last=S.i==S.ids.length-1;$('#next').innerHTML=`<button class="btn primary" id="n" style="margin-top:14px">${last?'看成績':'下一題'}</button>`;$('#n').onclick=()=>last?result():(S.i++,question())}
function result(){let score=C.type=='fill'?(S.retry?0:S.correctSlots/S.totalSlots*100):S.res.filter(x=>x.ok).length/S.res.length*100;if(C.type=='fill'&&!S.retry){let x=stats();x[C.g].n++;x[C.g].sum+=score;localStorage.setItem(SK,JSON.stringify(x))}if(!S.retry){let h=hist(),label=C.type=='fill'?`填充題 第${C.g}組（${b(C.g)[0]}–${b(C.g)[1]}）`:`選擇題 ${C.range=='front'?'前25題':C.range=='back'?'後25題':'全部50題'}`;h.unshift({label,score,ts:Date.now()});localStorage.setItem(HK,JSON.stringify(h.slice(0,10)))}let wrong=S.res.filter(x=>!x.ok);$('#app').innerHTML=`<div class="card"><h1>完成！</h1><div class="score">${C.type=='fill'&&S.retry?'錯題重練':F(score)+' 分'}</div>${C.type=='fill'&&!S.retry?`<div class="muted" style="text-align:center">答對 ${S.correctSlots}/${S.totalSlots} 格 · 每格 ${F(100/S.totalSlots)} 分</div>`:''}<button class="btn full" id="h">回首頁</button>${wrong.length?`<button class="btn primary full" id="rw" style="margin-top:8px">重練 ${wrong.length} 題錯題</button>`:''}</div>${wrong.map(r=>`<div class="card"><b>原題 ${r.id}</b><div class="trans">正確答案：${E(r.ans)}<br>中文：${E(r.zh)}</div>${r.a.length?`<div><b>發音：</b><br>${aud(r.a)}</div>`:''}</div>`).join('')}`;$('#h').onclick=home;if(wrong.length)$('#rw').onclick=()=>start(wrong.map(x=>x.id));ba()}
